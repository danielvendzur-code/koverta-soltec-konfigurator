name: Apply Soltec configurator fix

on:
  push:
    paths:
      - .github/workflows/apply-configurator-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 tools/apply_configurator_fix.py

      - name: Validate runtime
        run: |
          node --check soltec-premium.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('soltec-premium.js').read_text(encoding='utf-8')
          css = Path('soltec-premium.css').read_text(encoding='utf-8')
          assert "const root = document.getElementById('SoltecPremium');" not in html
          assert './soltec-premium.js?v=20260828-3' in html
          assert './soltec-premium.css?v=20260828-3' in html
          assert 'widthValue: null, lengthValue: null' in js
          assert "state.widthValue = Number(t.value)" in js
          assert "state.lengthValue = Number(t.value)" in js
          assert "w.step = '1'" in js and "l.step = '1'" in js
          assert 'depthAvg * 0.38 + depthFar * 0.62' in js
          assert 'facing(outward) > 0 ? 1200 : -1200' in js
          assert 'touch-action: none' in css
          print('Static validation passed')
          PY

      - name: Commit fixed build
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html soltec-premium.js soltec-premium.css
          git commit -m "Fix continuous sliders and 3D render ordering"
          git push origin HEAD:main
